<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 추첨기</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .numbers-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            min-height: 150px;
            align-items: center;
        }

        .number-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: popIn 0.5s ease-out backwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .bonus-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            position: relative;
            margin-top: 20px;
        }

        .bonus-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #f5576c;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            white-space: nowrap;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .draw-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .draw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .draw-btn:active {
            transform: translateY(0);
        }

        .draw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background: #d0d0d0;
        }

        .history {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .history-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: #f5f5f5;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.95em;
            color: #666;
        }

        .history-item small {
            color: #999;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 로또 추첨기</h1>
        <p class="subtitle">당신의 운을 시험해보세요!</p>

        <div class="numbers-container" id="numbersContainer">
            <p style="color: #999;">추첨 버튼을 클릭하세요</p>
        </div>

        <div class="button-group">
            <button class="draw-btn" id="drawBtn">추첨하기</button>
            <button class="reset-btn" id="resetBtn">초기화</button>
        </div>

        <div class="history">
            <div class="history-title">📋 추첨 이력</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // Supabase 설정
        const SUPABASE_URL = typeof __SUPABASE_URL__ !== 'undefined' && __SUPABASE_URL__ ? __SUPABASE_URL__ : '';
        const SUPABASE_ANON_KEY = typeof __SUPABASE_ANON_KEY__ !== 'undefined' && __SUPABASE_ANON_KEY__ ? __SUPABASE_ANON_KEY__ : '';
        
        let supabase = null;
        let history = [];

        // DOM 요소 선택
        const container = document.getElementById('numbersContainer');
        const drawBtn = document.getElementById('drawBtn');
        const resetBtn = document.getElementById('resetBtn');
        const historyList = document.getElementById('historyList');

        // Supabase 초기화
        function initSupabase() {
            if (SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes('__') && !SUPABASE_ANON_KEY.includes('__')) {
                try {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('✓ Supabase initialized');
                    return true;
                } catch (err) {
                    console.warn('Supabase initialization error:', err);
                }
            }
            console.log('⚠ Using local storage only');
            return false;
        }

        // 로컬 스토리지에서 이력 로드
        function loadLocalHistory() {
            const stored = localStorage.getItem('lottoHistory');
            history = stored ? JSON.parse(stored) : [];
        }

        // 이력 표시
        function displayHistory() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: #ccc; text-align: center;">아직 추첨 이력이 없습니다</p>';
                return;
            }
            history.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <strong>${item.numbers}</strong> + <span style="color: #f5576c;">보너스: ${item.bonus}</span>
                    <small>${item.time}</small>
                `;
                historyList.appendChild(div);
            });
        }

        // 로또 번호 생성
        function generateLotto() {
            const numbers = Array.from({ length: 45 }, (_, i) => i + 1);
            
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            const selectedNumbers = numbers.slice(0, 6).sort((a, b) => a - b);
            const bonusNumber = numbers[6];

            return { selectedNumbers, bonusNumber };
        }

        // 번호 화면에 표시
        function displayNumbers(selectedNumbers, bonusNumber) {
            container.innerHTML = '';

            selectedNumbers.forEach((num, index) => {
                const box = document.createElement('div');
                box.className = 'number-box';
                box.textContent = num;
                box.style.animationDelay = `${index * 0.1}s`;
                container.appendChild(box);
            });

            const bonusBox = document.createElement('div');
            bonusBox.className = 'number-box bonus-box';
            bonusBox.textContent = bonusNumber;
            bonusBox.style.animationDelay = '0.6s';
            
            const bonusLabel = document.createElement('div');
            bonusLabel.className = 'bonus-label';
            bonusLabel.textContent = '보너스';
            bonusBox.appendChild(bonusLabel);
            
            container.appendChild(bonusBox);
        }

        // Supabase에 저장
        async function saveToSupabase(numbersStr, bonusNumber) {
            if (!supabase) return;
            
            try {
                const { error } = await supabase
                    .from('lottery_history')
                    .insert([{
                        numbers: numbersStr,
                        bonus: bonusNumber
                    }]);
                
                if (error) {
                    console.warn('Supabase save error:', error);
                } else {
                    console.log('✓ Saved to Supabase');
                }
            } catch (err) {
                console.error('Supabase error:', err);
            }
        }

        // 추첨 버튼 이벤트
        if (drawBtn) {
            drawBtn.addEventListener('click', function() {
                drawBtn.disabled = true;

                const { selectedNumbers, bonusNumber } = generateLotto();
                displayNumbers(selectedNumbers, bonusNumber);

                const numbersStr = selectedNumbers.join(', ');
                const now = new Date();
                const timeStr = now.toLocaleString('ko-KR');
                
                history.unshift({
                    numbers: numbersStr,
                    bonus: bonusNumber,
                    time: timeStr
                });

                if (history.length > 10) {
                    history.pop();
                }

                localStorage.setItem('lottoHistory', JSON.stringify(history));
                
                // Supabase 저장
                saveToSupabase(numbersStr, bonusNumber);

                setTimeout(() => {
                    displayHistory();
                    drawBtn.disabled = false;
                }, 700);
            });
        }

        // 초기화 버튼 이벤트
        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                container.innerHTML = '<p style="color: #999;">추첨 버튼을 클릭하세요</p>';
                history = [];
                localStorage.removeItem('lottoHistory');
                displayHistory();
                
                if (supabase) {
                    supabase.from('lottery_history').delete().neq('id', '').catch(err => 
                        console.warn('Delete history error:', err)
                    );
                }
            });
        }

        // 초기화 함수
        function init() {
            loadLocalHistory();
            initSupabase();
            displayHistory();
        }

        // 페이지 로드 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
